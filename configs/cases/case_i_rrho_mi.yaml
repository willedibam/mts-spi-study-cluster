pyspi_config: configs/pyspi/case_i_rrho_mi.yaml

pyspi_subset: default
normalise: false
rng_seed: 110305
save_heatmap: false
threads: 16

defaults:
  M_values: [4, 8, 16]
  T_values: [200, 400, 800, 1600]
  instances: [0, 1, 2, 3, 4, 5, 6, 7]

