    generator: "case_i"
    include_base_variant: true
    base_params:
      a: 0.4
      b: 0.0
      c: 0.6
      g: "affine"
      g_params:
        alpha: 0.8
        beta: 0.0
      interaction: "prev"
      topology: "ring"
      noise_std: 0.05
      transients: 300
      x0: 0.0
      init_std: 1.0
      zscore: true
