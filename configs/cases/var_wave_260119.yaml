base_output_dir: data/case_260119_var_vs_wave_spi_corr/
pyspi_config: configs/pyspi/case_260119.yaml

pyspi_subset: default
normalise: false
rng_seed: 110305
save_heatmap: false
threads: 16

defaults:
  # "Smart" because:
  # - M spans small→moderate sizes without exploding O(M^2) pair computations
  # - T spans long enough to stabilize lagged measures + spectral measures
  # - T values are compatible with your wave discretization (see notes below)
  M_values: [8, 16]
  T_values: [400, 800, 1600, 3200]

  # NOTE: With your current wave generator, "instances" are redundant (see critique).
  # Keep this moderate unless you PATCH wave to randomize initial conditions.
  instances: [0, 1, 2, 3]

mts_classes:
  - name: "VAR(1)-RingSym"
    labels: ["linear", "gaussian", "var", "ring_symmetric"]
    generator: "varma"
    include_base_variant: true
    base_params:
      phi: 0.6
      coupling: 0.25
      topology: "ring-symmetric"
      ma_phi: 0.0
      ma_coupling: 0.0
      noise_std: 0.1
      transients: 500
      zscore: true
      target_rho: 0.95
    variants:
      - name: "near_critical"
        params:
          target_rho: 0.99

  # Optional control: directionality.
  # This can reduce your VAR↔wave separability if wave propagation looks “directed-like”
  # in some SPIs, but it's useful to know if directionality alone explains effects.
  - name: "VAR(1)-RingUni"
    labels: ["linear", "gaussian", "var", "ring_unidirectional"]
    generator: "varma"
    include_base_variant: true
    base_params:
      phi: 0.6
      coupling: 0.4
      topology: "ring-unidirectional"
      ma_phi: 0.0
      ma_coupling: 0.0
      noise_std: 0.1
      transients: 500
      zscore: true
      target_rho: 0.95
    variants:
      - name: "near_critical"
        params:
          target_rho: 0.99

  # - name: "Wave1D"
  #   labels: ["pde", "wave", "1d"]
  #   generator: "wave_1d"
  #   include_base_variant: true
  #   base_params:
  #     c: 10.0
  #     zscore: true
  #   variants:
  #     - name: "slow"
  #       params:
  #         c: 5.0
  #     - name: "fast"
  #       params:
  #         c: 20.0

  - name: "Wave1D"
    labels: ["pde", "wave", "1d"]
    generator: "wave_1d"
    include_base_variant: true
    base_params:
      c: 10.0
      vel_std: 0.2
      vel_modes: 8
      vel_decay: 2.0
      zscore: true
    variants:
      - name: "slow"
        params:
          c: 5.0
      - name: "fast"
        params:
          c: 20.0
      - name: "richer_velocity"
        params:
          vel_modes: 16
          vel_decay: 1.5
