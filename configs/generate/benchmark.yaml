# SPI benchmark: VAR(1) data across (M, T) grid.
# Used by scripts/benchmark_spis.py to measure per-SPI computation time.

base_output_dir: data/benchmark/
timestamp: false
pyspi_config: configs/pyspi-v2/blended_config.yaml
pyspi_subset: default
normalise: false
rng_seed: 42
save_heatmap: false
threads: 1

defaults:
  M_values: [3, 5, 10, 16, 20, 32, 64]
  T_values: [100, 500, 1000, 2000, 5000]
  instances: 1

mts_classes:
  - name: "var1-benchmark"
    labels: ["benchmark"]
    generator: "var"
    base_params:
      phi: 0.6
      coupling: 0.3
      ma_phi: 0.0
      ma_coupling: 0.0
      noise_std: 0.2
      transients: 100
      topology: "ring-symmetric"
      zscore: true
