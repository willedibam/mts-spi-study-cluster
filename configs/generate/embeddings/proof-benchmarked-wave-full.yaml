# proof-benchmarked-wave-full.yaml
# Wave-1d-default redux across the full M/T grid to replace the wave-1d
# subdirectory in data/embeddings/proof_benchmarked_full_260424/.
# Pairs with proof-benchmarked-full.yaml.
#
# Why a redux: see proof-benchmarked-wave.yaml. Same fix (center_jitter=0.5).
#
# Scope: 1 class * 3 M * 3 T * 50 instances = 450 datasets.
# After run: rsync data/embeddings/proof_benchmarked_wave_full_260428/wave-1d-default/
# over data/embeddings/proof_benchmarked_full_260424/wave-1d-default/.
base_output_dir: data/embeddings/proof_benchmarked_wave_full_260428/
timestamp: false
pyspi_config: configs/pyspi-v2/benchmarked_config.yaml
pyspi_subset: default
normalise: false
rng_seed: 110305
save_heatmap: true
threads: 4

defaults:
  M_values: [5, 10, 20]
  T_values: [500, 1000, 2000]
  instances: 50

mts_classes:
  - name: "wave-1d-default"
    labels: [wave, pde, 1d]
    generator: "wave_1d"
    base_params:
      c: 10.0
      center_jitter: 0.5
      sigma_factor: 0.05
      vel_std: 0.0
      zscore: true
