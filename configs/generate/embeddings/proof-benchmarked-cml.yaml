# proof-benchmarked.yaml
# Re-run of proof.yaml classes with benchmarked_config SPI set, at M=10/T=1000.
# Purpose: provide anchors in the SAME SPI space as cml-param-sweep (also
# benchmarked, also M=10/T=1000) so SPI-SPI feature vectors are directly
# comparable for PCA fit + sweep projection.
#
# Scope:
# - 20 classes: 5 VAR variants + 2 Kuramoto + 2 noise + 10 CML + 1 wave-1d.
# - Single (M, T) = (10, 1000). 50 instances each -> 1000 datasets total.
# - kuramoto split into fast-omega (K=-4, omega=3.0) and slow-omega
#   (K=-4, omega=0.025) variants.
base_output_dir: data/embeddings/proof_benchmarked_260424/
timestamp: false
pyspi_config: configs/pyspi-v2/benchmarked90_amortized_config.yaml
normalise: false
rng_seed: 110305
save_heatmap: true
threads: 1

defaults:
  M_values: [10]
  T_values: [1000]
  instances: 50

mts_classes:
  # --- VAR(1) ring-symmetric ---
  - name: "var-ring-sym_phi-0.95_cpl-0.4"
    labels: [var, linear, ring-symmetric]
    generator: "varma"
    base_params:
      phi: 0.95
      coupling: 0.4
      ma_phi: 0.0
      ma_coupling: 0.0
      noise_std: 0.1
      topology: "ring-symmetric"
      transients: 100
      zscore: true

  - name: "var-ring-sym_phi-0.2_cpl-0.4"
    labels: [var, linear, ring-symmetric]
    generator: "varma"
    base_params:
      phi: 0.2
      coupling: 0.4
      ma_phi: 0.0
      ma_coupling: 0.0
      noise_std: 0.1
      topology: "ring-symmetric"
      transients: 100
      zscore: true

  - name: "var-ring-sym_phi-0.6_cpl-0.4"
    labels: [var, linear, ring-symmetric]
    generator: "varma"
    base_params:
      phi: 0.6
      coupling: 0.4
      ma_phi: 0.0
      ma_coupling: 0.0
      noise_std: 0.1
      topology: "ring-symmetric"
      transients: 100
      zscore: true

  - name: "var-ring-sym_phi-0.6_cpl-0.1"
    labels: [var, linear, ring-symmetric]
    generator: "varma"
    base_params:
      phi: 0.6
      coupling: 0.1
      ma_phi: 0.0
      ma_coupling: 0.0
      noise_std: 0.1
      topology: "ring-symmetric"
      transients: 100
      zscore: true

  - name: "var-ring-sym_phi-0.6_cpl-0.8"
    labels: [var, linear, ring-symmetric]
    generator: "varma"
    base_params:
      phi: 0.6
      coupling: 0.8
      ma_phi: 0.0
      ma_coupling: 0.0
      noise_std: 0.1
      topology: "ring-symmetric"
      transients: 100
      zscore: true

  # --- Kuramoto (fast-omega all-to-all, per user spec) ---
  # omega_std = 3.0 / sqrt(3) (uniform-std moment match for U(0, 2*3)).
  - name: "kuramoto_omega-fast"
    labels: [kuramoto, nonlinear, all-to-all, pyclustering-port]
    generator: "kuramoto"
    base_params:
      K: -4.0
      dt: 0.00625
      omega_mean: 3.0
      omega_std: 1.73205
      eta: 0.0
      output: "sin"
      connectivity: "all-to-all"
      transients: 100
      zscore: true

  # --- Kuramoto (slow-omega pyclustering port, unchanged from proof.yaml) ---
  - name: "kuramoto_omega-slow"
    labels: [kuramoto, nonlinear, all-to-all, pyclustering-port]
    generator: "kuramoto"
    base_params:
      K: -4.0
      dt: 0.00625
      omega_mean: 0.025
      omega_std: 0.01443
      eta: 0.0
      output: "sin"
      connectivity: "all-to-all"
      transients: 100
      zscore: true

  # --- Null models ---
  - name: "cauchy-noise"
    labels: [noise, null, cauchy]
    generator: "cauchy_noise"
    base_params:
      zscore: false

  - name: "gaussian-noise"
    labels: [noise, null, gaussian]
    generator: "gaussian_noise"
    base_params:
      zscore: true

  # --- Coupled Map Lattice regimes ---
  - name: "frozen-chaos"
    labels: [cml, frozen-chaos]
    generator: "cml_logistic"
    base_params:
      alpha: 1.45
      eps: 0.2
      transients: 2000
      sample_every: 1
      zscore: false

  - name: "pattern-selection"
    labels: [cml, pattern-selection]
    generator: "cml_logistic"
    base_params:
      alpha: 1.71
      eps: 0.4
      transients: 1000
      sample_every: 1
      zscore: false

  - name: "brownian-defect"
    labels: [cml, brownian-defect]
    generator: "cml_logistic"
    base_params:
      alpha: 1.85
      eps: 0.1
      transients: 1000
      sample_every: 1
      zscore: false

  - name: "defect-turbulence"
    labels: [cml, defect-turbulence]
    generator: "cml_logistic"
    base_params:
      alpha: 1.895
      eps: 0.1
      transients: 1000
      sample_every: 1
      zscore: false

  - name: "sti-i"
    labels: [cml, sti, directed-percolation]
    generator: "cml_logistic"
    base_params:
      alpha: 1.7522
      eps: 0.00115
      transients: 1000
      sample_every: 1
      zscore: false
      delta: [3, 6, 12]

  - name: "sti-ii"
    labels: [cml, sti, on-off-intermittency]
    generator: "cml_logistic"
    base_params:
      alpha: 1.75
      eps: 0.3
      transients: 1000
      sample_every: 1
      zscore: false

  - name: "fdstc"
    labels: [cml, fully-developed-stc]
    generator: "cml_logistic"
    base_params:
      alpha: 2.0
      eps: 0.3
      transients: 1000
      sample_every: 1
      zscore: false

  - name: "traveling-wave"
    labels: [cml, traveling-wave]
    generator: "cml_logistic"
    base_params:
      alpha: 1.47
      eps: 0.5
      transients: 1000
      sample_every: 1
      zscore: false

  - name: "chaotic-traveling-wave"
    labels: [cml, traveling-wave, chaotic]
    generator: "cml_logistic"
    base_params:
      alpha: 1.69
      eps: 0.5
      transients: 1000
      sample_every: 1
      zscore: false

  - name: "traveling-wave-kaneko67"
    labels: [cml, traveling-wave]
    generator: "cml_logistic"
    base_params:
      alpha: 1.67
      eps: 0.5
      transients: 1000
      sample_every: 1
      zscore: false

  # --- Wave equation (1D, random multi-mode Fourier IC) ---
  # Each instance draws independent mode amplitudes/phases, so instances
  # are not circular shifts of one another.
  - name: "wave-1d"
    labels: [wave, pde, 1d]
    generator: "wave_1d"
    base_params:
      c: 10.0
      n_modes: 5
      ic_decay: 1.5
      noise_std: 0.01
      zscore: true
