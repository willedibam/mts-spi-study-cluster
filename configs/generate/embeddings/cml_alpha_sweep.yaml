# CML logistic lattice alpha-sweep for embedding-space animation.
# Fixed eps = 0.3; alpha in [1.40, 2.00] step 0.015 (41 values);
# 3 instances per alpha -> 123 datasets. Each instance is an independent
# fresh-IC realisation (not a carried chain — the cluster path trades
# visual IC-continuity for per-job parallelism).
base_output_dir: data/embeddings/cml_alpha_sweep_260423/
timestamp: false
pyspi_config: configs/pyspi-v2/blended_sonnet_config.yaml
pyspi_subset: default
normalise: false
rng_seed: 260423
save_heatmap: true
threads: 4

defaults:
  M_values: [10]
  T_values: [500]
  instances: 3

mts_classes:
  - name: "cml-alpha-sweep"
    labels: [cml, alpha-sweep]
    generator: "cml_logistic"
    base_params:
      eps: 0.3
      transients: 2000
      sample_every: 1
      zscore: true
    include_base_variant: false
    variants:
      - { name: "a1p4000", params: { alpha: 1.4000 } }
      - { name: "a1p4150", params: { alpha: 1.4150 } }
      - { name: "a1p4300", params: { alpha: 1.4300 } }
      - { name: "a1p4450", params: { alpha: 1.4450 } }
      - { name: "a1p4600", params: { alpha: 1.4600 } }
      - { name: "a1p4750", params: { alpha: 1.4750 } }
