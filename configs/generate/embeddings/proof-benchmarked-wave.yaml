# proof-benchmarked-wave.yaml
# Wave-1d-default redux at M=10/T=1000 to replace the wave-1d subdirectory in
# data/embeddings/proof_benchmarked_260424/. Pairs with proof-benchmarked.yaml.
#
# Why a redux: original run used vel_std=0.2 random IC velocity only, which
# produced near-identical instances (median pairwise rel-L2 ~1.4%). New
# generator uses center_jitter=0.5 for full-domain randomisation of the
# Gaussian pulse centre -> meaningful intra-class variation while staying
# inside BDT's "default Gaussian IC, periodic BC" spec.
#
# Scope: 1 class * 1 M * 1 T * 50 instances = 50 datasets.
# After run: rsync data/embeddings/proof_benchmarked_wave_260428/wave-1d-default/
# over data/embeddings/proof_benchmarked_260424/wave-1d-default/.
base_output_dir: data/embeddings/proof_benchmarked_wave_260428/
timestamp: false
pyspi_config: configs/pyspi-v2/benchmarked_config.yaml
pyspi_subset: default
normalise: false
rng_seed: 110305
save_heatmap: true
threads: 4

defaults:
  M_values: [10]
  T_values: [1000]
  instances: 50

mts_classes:
  - name: "wave-1d-default"
    labels: [wave, pde, 1d]
    generator: "wave_1d"
    base_params:
      c: 10.0
      center_jitter: 0.5
      sigma_factor: 0.05
      vel_std: 0.0
      zscore: true
