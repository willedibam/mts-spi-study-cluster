base_output_dir: data/embeddings/proof_260420/
timestamp: false
pyspi_config: configs/pyspi-v2/benchmarked90_amortized_config.yaml
normalise: false
rng_seed: 110305
save_heatmap: true
threads: 1

defaults:
  M_values: [5, 10, 20]
  T_values: [500, 1000, 2000]
  instances: 10

mts_classes:
  # --- VAR(1) ring-symmetric (pure AR, no MA) ---
  - name: "var-ring-sym"
    labels: [var, linear, ring-symmetric]
    generator: "varma"
    base_params:
      phi: 0.8
      coupling: 0.4
      ma_phi: 0.0
      ma_coupling: 0.0
      noise_std: 0.1
      topology: "ring-symmetric"
      transients: 100
      zscore: true

  # --- Kuramoto (ours: bidirectional list, narrow-band incoherent) ---
  # Tuned for max distinguishability vs gaussian/cauchy/var/sti-ii on a
  # 6-feature proxy (corr, PLV, lag1, kurtosis, spec peak, freq spread).
  # omega_mean=4*pi (~2 Hz at dt=0.05) gives ~100 cycles per T=1000 window
  # -> sharp narrow-band spectral peak, the signature pyspi spectral SPIs
  # should latch onto. Coupling K=-2 stays in the incoherent regime
  # (r ~ 0.2-0.4 across M) since K_c scales with M for local topology;
  # genuine partial sync at all M is not achievable with one config.
  - name: "kuramoto"
    labels: [kuramoto, nonlinear, bidirectional-list]
    generator: "kuramoto"
    base_params:
      K: -2.0
      dt: 0.05
      omega_mean: 12.56637061   # 4*pi
      omega_std: 7.53982237     # 0.6 * omega_mean
      eta: 0.05
      output: "sin"
      connectivity: "bidirectional-list"
      transients: 2000
      zscore: true

  # --- Kuramoto (theirs: pyclustering port, all-to-all, slow, splay-state) ---
  # Port of a collaborator's pyclustering.sync_network config:
  #   sync_network(M, weight=-4, frequency=0.05, type_conn=ALL_TO_ALL)
  #   np.sin(output)
  # with steps = 100 + T and time = 10*T/1500.
  #
  # Convention translation:
  #   - Pyclustering ODE: dθ_i/dt = ω_i + (K/N)·Σ_j sin(θ_j - θ_i)
  #   - Our ODE:          dθ_i/dt = ω_i + (K/deg_i)·Σ_j A_ij·sin(θ_j - θ_i)
  #     For all-to-all deg = N-1, so per-pair coupling differs by (N-1)/N
  #     (~5-20% for M in {5,10,20}). K=-4 is a faithful port at this tolerance.
  #   - Their `frequency=0.05` seeds ω_i ~ U(0, 0.05); our generator samples
  #     ω_i ~ N(omega_mean, omega_std), so we match moments:
  #       mean(U(0,0.05)) = 0.025
  #       std (U(0,0.05)) = 0.05/sqrt(12) ≈ 0.01443
  #     Distributional shape differs (uniform vs gaussian) but ω is tiny
  #     and coupling-dominated so this is negligible.
  #   - Their dt = time/steps = (10*T/1500)/(100+T) ≈ 0.00625 for T=1500.
  #
  # Dynamics: homogeneous-ish slow ω + strong repulsive all-to-all coupling
  # + no stochastic noise -> deterministic anti-phase splay/cluster states
  # seeded by random initial phases. Structured pair-level patterns that
  # pyspi coherence/PLV/Granger should register strongly; expected to sit
  # far from gaussian in the SPI-SPI feature space.
  - name: "kuramoto-pyc"
    labels: [kuramoto, nonlinear, all-to-all, pyclustering-port]
    generator: "kuramoto"
    base_params:
      K: -4.0
      dt: 0.00625
      omega_mean: 0.025
      omega_std: 0.01443        # 0.05 / sqrt(12), matches U(0, 0.05) std
      eta: 0.0
      output: "sin"
      connectivity: "all-to-all"
      transients: 100
      zscore: true

  # --- Null models ---
  - name: "cauchy-noise"
    labels: [noise, null, cauchy]
    generator: "cauchy_noise"
    base_params:
      zscore: false

  - name: "gaussian-noise"
    labels: [noise, null, gaussian]
    generator: "gaussian_noise"
    base_params:
      zscore: true

  # --- Coupled Map Lattice regimes ---
  - name: "frozen-chaos"
    labels: [cml, frozen-chaos]
    generator: "cml_logistic"
    base_params:
      alpha: 1.45
      eps: 0.2
      transients: 2000
      sample_every: 1
      zscore: false

  - name: "pattern-selection"
    labels: [cml, pattern-selection]
    generator: "cml_logistic"
    base_params:
      alpha: 1.71
      eps: 0.4
      transients: 1000
      sample_every: 1
      zscore: false

  - name: "brownian-defect"
    labels: [cml, brownian-defect]
    generator: "cml_logistic"
    base_params:
      alpha: 1.85
      eps: 0.1
      transients: 1000
      sample_every: 1
      zscore: false

  - name: "defect-turbulence"
    labels: [cml, defect-turbulence]
    generator: "cml_logistic"
    base_params:
      alpha: 1.895
      eps: 0.1
      transients: 1000
      sample_every: 1
      zscore: false

  - name: "sti-i"
    labels: [cml, sti, directed-percolation]
    generator: "cml_logistic"
    base_params:
      alpha: 1.7522
      eps: 0.00115
      transients: 1000
      sample_every: 1
      zscore: false
      delta: [3, 6, 12]

  - name: "sti-ii"
    labels: [cml, sti, on-off-intermittency]
    generator: "cml_logistic"
    base_params:
      alpha: 1.75
      eps: 0.3
      transients: 1000
      sample_every: 1
      zscore: false

  - name: "fdstc"
    labels: [cml, fully-developed-stc]
    generator: "cml_logistic"
    base_params:
      alpha: 2.0
      eps: 0.3
      transients: 1000
      sample_every: 1
      zscore: false

  - name: "traveling-wave"
    labels: [cml, traveling-wave]
    generator: "cml_logistic"
    base_params:
      alpha: 1.47
      eps: 0.5
      transients: 1000
      sample_every: 1
      zscore: false

  - name: "chaotic-traveling-wave"
    labels: [cml, traveling-wave, chaotic]
    generator: "cml_logistic"
    base_params:
      alpha: 1.69
      eps: 0.5
      transients: 1000
      sample_every: 1
      zscore: false

  - name: "traveling-wave-kaneko67"
    labels: [cml, traveling-wave]
    generator: "cml_logistic"
    base_params:
      alpha: 1.67
      eps: 0.5
      transients: 1000
      sample_every: 1
      zscore: false
