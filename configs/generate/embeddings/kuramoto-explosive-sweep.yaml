# Explosive (first-order) Kuramoto synchronization sweep on a BA scale-free network.
# SPI set: benchmarked_p90.yaml
#
# FIRST-ORDER / HYSTERETIC transition (Gomez-Gardenes et al., PRL 2011): omega_i ∝ degree_i
# on a Barabasi-Albert net yields a discontinuous r jump + a hysteresis loop. Validated with
# this generator (M=32, dt=0.01, sample_every=4, eta=0.05): forward jumps ~K=1.10, backward
# drops ~K=0.90, bistable window K in [0.90, 1.10]; random-IC samples only the lower branch
# (=> continuation required). eta=0.05 breaks the rank-2 collinearity of the fully-synced state
# (synced corr-rank 2->32), keeping pairwise SPIs well-defined without shifting the loop.
#
# *** THIS CONFIG IS NOT SELF-GENERATING ***
# Hysteresis needs quasi-static continuation (each K seeded from the previous K's final state),
# which is sequential and cannot be produced by the harness's independent random-IC generation.
# WORKFLOW:
#   1. python -m src.preseed_explosive --config configs/generate/embeddings/kuramoto-explosive-sweep.yaml
#        -> runs forward+backward adiabatic sweeps per instance, writes timeseries.npy into each
#           dataset dir (forward: K ascending from random IC; backward: K descending from synced IC).
#   2. run the standard harness (run_experiments) -> it finds the cached timeseries.npy, SKIPS
#      regeneration, and runs pyspi in parallel as usual.
#   3. process_features as usual.
#
# dK=0.05 is REQUIRED: dK=0.1 fails to resolve the ~0.20-wide loop (verified). The located
# K_fwd/K_bwd depend on dK and the per-step settle (transients); these are experiment parameters.
#
# M = system size N. Network fixed per instance (network_seed=instance), shared by fwd+bwd.
# Datasets: 41 K x 2 branches x instances. FSS: regenerate with M_values [16,32,64,128].
# Recorded span = T * sample_every * dt = 2000*4*0.01 = 80 time units (~38 cycles of the
# slowest, omega=degree_min=3) so phase/coherence SPIs see enough oscillation cycles.
base_output_dir: data/embeddings/kuramoto_explosive_260616/
timestamp: false
pyspi_config: configs/pyspi/benchmarked_p90.yaml
normalise: false
rng_seed: 110305
save_heatmap: true
threads: 1

defaults:
  M_values: [32]          # system size N; FSS later: [16, 32, 64, 128]
  T_values: [2000]
  instances: 10

mts_classes:
  - name: "kuramoto-explosive-sweep"
    labels: [kuramoto, explosive, k-sweep, scale-free, hysteresis]
    generator: "kuramoto_explosive"
    base_params:
      m_ba: 3
      omega_scale: 1.0
      dt: 0.01
      sample_every: 4       # record every 4th step -> 80 t.u. span (~38 cycles of slowest)
      eta: 0.05             # phase noise: breaks synced rank-2 degeneracy, keeps K_c
      transients: 4000      # per-step settle for adiabatic continuation (40 t.u. @ dt=0.01)
      output: "sin"
      zscore: false
    include_base_variant: false
    variants:
      - { name: "k0p00_for", params: { K: 0.00, branch: "forward" } }
      - { name: "k0p05_for", params: { K: 0.05, branch: "forward" } }
      - { name: "k0p10_for", params: { K: 0.10, branch: "forward" } }
