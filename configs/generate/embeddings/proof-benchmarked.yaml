# proof-benchmarked.yaml
# Re-run of proof.yaml classes with benchmarked_config SPI set, at M=10/T=1000.
# Purpose: provide anchors in the SAME SPI space as cml-param-sweep (also
# benchmarked, also M=10/T=1000) so SPI-SPI feature vectors are directly
# comparable for PCA fit + sweep projection.
#
# Scope:
# - All 15 proof.yaml classes (10 CML + 5 non-CML controls).
# - Single (M, T) = (10, 1000). 10 instances each -> 150 datasets total.
# - kuramoto class updated to fast-omega all-to-all variant.
base_output_dir: data/embeddings/proof_benchmarked_260424/
timestamp: false
pyspi_config: configs/pyspi-v2/benchmarked_config.yaml
pyspi_subset: default
normalise: false
rng_seed: 110305
save_heatmap: true
threads: 4

defaults:
  M_values: [10]
  T_values: [1000]
  instances: 10

mts_classes:
  # --- VAR(1) ring-symmetric ---
  - name: "var-ring-sym"
    labels: [var, linear, ring-symmetric]
    generator: "varma"
    base_params:
      phi: 0.8
      coupling: 0.4
      ma_phi: 0.0
      ma_coupling: 0.0
      noise_std: 0.1
      topology: "ring-symmetric"
      transients: 100
      zscore: true

  # --- Kuramoto (fast-omega all-to-all, per user spec) ---
  # omega_std = 3.0 / sqrt(3) (uniform-std moment match for U(0, 2*3)).
  - name: "kuramoto"
    labels: [kuramoto, nonlinear, all-to-all, pyclustering-port]
    generator: "kuramoto"
    base_params:
      K: -4.0
      dt: 0.00625
      omega_mean: 3.0
      omega_std: 1.73205
      eta: 0.0
      output: "sin"
      connectivity: "all-to-all"
      transients: 100
      zscore: true

  # --- Kuramoto (slow-omega pyclustering port, unchanged from proof.yaml) ---
  - name: "kuramoto-pyc"
    labels: [kuramoto, nonlinear, all-to-all, pyclustering-port]
    generator: "kuramoto"
    base_params:
      K: -4.0
      dt: 0.00625
      omega_mean: 0.025
      omega_std: 0.01443
      eta: 0.0
      output: "sin"
      connectivity: "all-to-all"
      transients: 100
      zscore: true

  # --- Null models ---
  - name: "cauchy-noise"
    labels: [noise, null, cauchy]
    generator: "cauchy_noise"
    base_params:
      zscore: false

  - name: "gaussian-noise"
    labels: [noise, null, gaussian]
    generator: "gaussian_noise"
    base_params:
      zscore: true

  # --- Coupled Map Lattice regimes ---
  - name: "frozen-chaos"
    labels: [cml, frozen-chaos]
    generator: "cml_logistic"
    base_params:
      alpha: 1.45
      eps: 0.2
      transients: 2000
      sample_every: 1
      zscore: true

  - name: "pattern-selection"
    labels: [cml, pattern-selection]
    generator: "cml_logistic"
    base_params:
      alpha: 1.71
      eps: 0.4
      transients: 1000
      sample_every: 1
      zscore: true

  - name: "brownian-defect"
    labels: [cml, brownian-defect]
    generator: "cml_logistic"
    base_params:
      alpha: 1.85
      eps: 0.1
      transients: 1000
      sample_every: 1
      zscore: true

  - name: "defect-turbulence"
    labels: [cml, defect-turbulence]
    generator: "cml_logistic"
    base_params:
      alpha: 1.895
      eps: 0.1
      transients: 1000
      sample_every: 1
      zscore: true

  - name: "sti-i"
    labels: [cml, sti, directed-percolation]
    generator: "cml_logistic"
    base_params:
      alpha: 1.7522
      eps: 0.00115
      transients: 1000
      sample_every: 1
      zscore: true
      delta: [3, 6, 12]

  - name: "sti-ii"
    labels: [cml, sti, on-off-intermittency]
    generator: "cml_logistic"
    base_params:
      alpha: 1.75
      eps: 0.3
      transients: 1000
      sample_every: 1
      zscore: true

  - name: "fdstc"
    labels: [cml, fully-developed-stc]
    generator: "cml_logistic"
    base_params:
      alpha: 2.0
      eps: 0.3
      transients: 1000
      sample_every: 1
      zscore: true

  - name: "traveling-wave"
    labels: [cml, traveling-wave]
    generator: "cml_logistic"
    base_params:
      alpha: 1.47
      eps: 0.5
      transients: 1000
      sample_every: 1
      zscore: true

  - name: "chaotic-traveling-wave"
    labels: [cml, traveling-wave, chaotic]
    generator: "cml_logistic"
    base_params:
      alpha: 1.69
      eps: 0.5
      transients: 1000
      sample_every: 1
      zscore: true

  - name: "traveling-wave-kaneko67"
    labels: [cml, traveling-wave]
    generator: "cml_logistic"
    base_params:
      alpha: 1.67
      eps: 0.5
      transients: 1000
      sample_every: 1
      zscore: true
