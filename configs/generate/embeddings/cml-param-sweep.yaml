# CML logistic lattice parameter sweep for embedding-space animation or other analysis.
# SPI set: benchmarked_p90.yaml
#
# Downstream: meta.json per dataset stores generator.params.{alpha,eps},
# variant.{name,params}, instance_index. This is sufficient to reconstruct
# the (alpha, eps, instance) coordinate of every frame at aggregation time.
base_output_dir: data/embeddings/cml_param_sweep_260508/
timestamp: false
pyspi_config: configs/pyspi/benchmarked_p90.yaml
normalise: false
rng_seed: 110305
save_heatmap: true
threads: 1

defaults:
  M_values: [20]
  T_values: [1000]
  instances: 20

mts_classes:
  - name: "cml-alpha-sweep"
    labels: [cml, alpha-sweep]
    generator: "cml_logistic"
    base_params:
      eps: 0.3
      transients: 2000
      sample_every: 1
      zscore: false
    include_base_variant: false
    variants:
