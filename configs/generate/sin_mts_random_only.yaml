base_output_dir: data/sin_mts_random_only/
pyspi_config: configs/pyspi/cases/r_rho_mi.yaml
pyspi_subset: default
normalise: false
rng_seed: 42
save_heatmap: false
threads: 4

defaults:
  M_values: [4, 8]
  T_values: [1000]
  instances: 512
mts_classes:
  - name: "SinMTS-Random"
    labels: ["sinusoidal", "random"]
    generator: "sin_mts"
    base_params:
      regime: "random"
      noise_std: 0.05
      zscore: false
