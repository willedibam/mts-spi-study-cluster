base_output_dir: data/order_parameter/kuramoto_p90_pilot
timestamp: false
pyspi_config: configs/pyspi/benchmarked_p90.yaml
normalise: false
rng_seed: 410731
save_heatmap: false
threads: 1

defaults:
  M_values: [20]
  T_values: [1000]
  instances: 1

mts_classes:
  - name: kuramoto-gaussian-pilot
    labels: [kuramoto, order-parameter, gaussian, pilot]
    generator: kuramoto_order_parameter
    seed_scope: instance
    base_params:
      N_full: 256
      dt: 0.02
      sample_dt: 0.10
      burn_time: 100.0
      omega_mean: 1.0
      omega_std: 1.0
      frequency_distribution: gaussian
      frequency_sampling: random
      output: cos
      sensor_phase_std: 0.0
      zscore: false
    include_base_variant: false
    variants:
      - {name: kappa0p8, params: {K: 1.276615297285}}
      - {name: kappa1p0, params: {K: 1.595769121606}}
      - {name: kappa1p4, params: {K: 2.234076770248}}

  - name: kuramoto-logistic-pilot
    labels: [kuramoto, order-parameter, logistic, pilot]
    generator: kuramoto_order_parameter
    seed_scope: instance
    base_params:
      N_full: 256
      dt: 0.02
      sample_dt: 0.10
      burn_time: 100.0
      omega_mean: 1.0
      omega_std: 1.0
      frequency_distribution: logistic
      frequency_sampling: random
      output: cos
      sensor_phase_std: 0.0
      zscore: false
    include_base_variant: false
    variants:
      - {name: kappa0p8, params: {K: 1.123158002890}}
      - {name: kappa1p0, params: {K: 1.403947503612}}
      - {name: kappa1p4, params: {K: 1.965526505057}}
