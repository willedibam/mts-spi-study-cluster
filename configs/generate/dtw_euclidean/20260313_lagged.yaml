base_output_dir: data/dtw_euclidean/260313_lagged-3/
timestamp: false
pyspi_config: configs/pyspi-v2/cases/dtw_euclidean.yaml
pyspi_subset: default
normalise: false
rng_seed: 42
save_heatmap: false
threads: 4

defaults:
  M_values: [16]
  T_values: [100]
  instances: 30

mts_classes:
  # A=1: tau_i = 0 for all channels (no lag; pure noisy copies of the mother)
  - name: "un-lagged_A-1"
    labels: [lagged-mother, tau-zero]
    generator: "lagged_mts"
    base_params:
      A: 1.0
      linspace: false
      noise_std: 0.1
      noise_std_variable: true
      noise_std_scale: 2.718
      ar1_a: 0.5
      ar1_noise_std: 1.0
      zscore: true

  # A=5: linspace lags 0..4; channels 0,4,8,12,... carry progressively larger lags
  - name: "var-lagged_A-2"
    labels: [lagged-mother, short-lag]
    generator: "lagged_mts"
    base_params:
      A: 2.0
      linspace: false
      noise_std: 0.1
      noise_std_variable: true
      noise_std_scale: 2.718
      ar1_a: 0.5
      ar1_noise_std: 1.0
      zscore: true

  - name: "var-lagged_A-5"
    labels: [lagged-mother, short-lag]
    generator: "lagged_mts"
    base_params:
      A: 5.0
      linspace: false
      noise_std: 0.1
      noise_std_variable: true
      noise_std_scale: 2.718
      ar1_a: 0.5
      ar1_noise_std: 1.0
      zscore: true

  - name: "lin-lagged_A-5"
    labels: [lagged-mother, short-lag]
    generator: "lagged_mts"
    base_params:
      A: 5.0
      linspace: true
      noise_std: 0.1
      noise_std_variable: true
      noise_std_scale: 2.718
      ar1_a: 0.5
      ar1_noise_std: 1.0
      zscore: true

  # A=16: linspace lags 0..15; M=16 channels each offset by 1 step (0,1,...,15)
  - name: "lin-lagged_A-16"
    labels: [lagged-mother, long-lag]
    generator: "lagged_mts"
    base_params:
      A: 16.0
      linspace: true
      noise_std: 0.1
      noise_std_variable: true
      noise_std_scale: 2.718
      ar1_a: 0.5
      ar1_noise_std: 1.0
      zscore: true
