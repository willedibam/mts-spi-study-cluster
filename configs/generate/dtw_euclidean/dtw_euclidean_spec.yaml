- name: fixed_m-16_w-0
  labels:
  - warping
  - fixed
  - rebound
  generator: warping_mts
  base_params:
    warping_channel_regime: fixed
    n_noisy: 16
    n_warped: 0
    warping_path_regime: rebound
    warp_p: 0.1
    warp_p_step: 0.9
    noise_std: 0.1
    ar1_a: 0.8
    ar1_noise_std: 1.0
    zscore: false

