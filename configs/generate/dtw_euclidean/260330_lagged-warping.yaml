      noise_std_scale: 2.718
      noise_dist: "uniform"
      ar1_a: 0.5
      ar1_noise_std: 1.0
      zscore: true

  - name: "lag-5_pstep-0.5"
    labels: [lagged-warping, moderate-warp]
