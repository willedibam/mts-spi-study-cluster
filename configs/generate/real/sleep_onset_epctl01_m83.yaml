base_output_dir: data/sleep_onset/
timestamp: false
pyspi_config: configs/pyspi-v2/benchmarked90_amortized_config.yaml
normalise: false          # data is already z-scored per channel (full recording)
rng_seed: 0
save_heatmap: false
threads: 1                # one pyspi worker per dataset; parallelism is across epochs

# Real EEG: M=83 channels (full EEG montage), T=500 samples (5 s @ 100 Hz),
# one dataset per epoch. Source tensor: EPCTL01_tensor_EEGonly_zscore.npz.
# timeseries.npy files are written by:
#   python -m src.prep_sleep_onset --subject EPCTL01 --tensor EEGonly_zscore \
#       --label epctl01-m83
# The aeon package/dataset_name below is a fail-loud sentinel and is never
# downloaded while those files exist. 168 epochs -> 168 PBS array jobs.

mts_classes:
  - name: "epctl01-m83"
    labels: ["eeg", "sleep-onset", "epctl01", "m83"]
    package: "aeon"
    dataset_name: "EPCTL01_EEGonly"   # not a real aeon dataset; see note above
    classes: ["epctl01-m83"]
    zscore: false                     # already z-scored by src/prep_sleep_onset.py
    instances: 168
