# Functional-form case study (2026-06-22): filter-roll generator.
# Three iterations as classes, each a progressive filtration of channel filter families:
#   iter1_L     : all linear                       -> r, rho, MI all agree
#   iter2_LM    : half linear, half monotone(sig)  -> corr(r,rho) drops; corr(rho,MI) stays high
#   iter3_LMNM  : + small non-monotone minority     -> corr(.,MI) drops; corr(r,rho) recovers
# Shared AR(1) mother per MTS; per-channel SNR spread (noise_std_variable) populates the MPI.
# CLEAN-SIGNAL variant (2026-07-03): low noise floor + moderate beta + broadened SNR spread.
#   floor noise_std=0.01 (all iters): near-noiseless channels -> rho stays ~0.99 (no spurious rho drops);
#     deepens the aggregate corr(r,rho) break to ~0.21 (vs 0.77 at the old floor 0.1) and yields clean
#     glyph pairs (best L-M: rho 0.993, r 0.896, gap 0.096).
#   beta=5 (not 2pi): same glyph gap as 2pi but a deeper break AND no saturation confound
#     (iter3 M-NM MI ~1.00 vs 0.82 at 2pi, which darkens the MI block; M-M rho 0.96 vs 0.94).
#   noise_std_scale=5: E[kappa]=5 -> representative SNR mix (ultra-clean/clean/medium/med-weak) for the
#     strength-of-dependency axis. NB scale is a corr(r,rho) confound: >~10 re-correlates r,rho and kills
#     the break. std_i = 0.01*kappa, kappa~Geom(1/scale). See notebooks/presentation/r_rho_mi_figure_plan.md.
base_output_dir: data/r_rho_mi/260703_g-roll/
timestamp: false
pyspi_config: configs/pyspi/cases/r_rho_mi.yaml
normalise: false
rng_seed: 260622
save_heatmap: false
threads: 1

defaults:
  M_values: [32]
  T_values: [2000]
  instances: 50

mts_classes:

  - name: "iter1_L"
    labels: [filter-roll, linear]
    generator: "filter_roll_mts"
    base_params:
      n_linear: 32
      n_monotonic: 0
      n_nonmonotonic: 0
      beta: 5.0
      noise_std: 0.01
      noise_std_variable: true
      noise_std_scale: 5.0
      ar1_a: 0.8
      ar1_noise_std: 1.0
      zscore: true

  - name: "iter2_LM"
    labels: [filter-roll, linear, monotonic]
    generator: "filter_roll_mts"
    base_params:
      n_linear: 16
      n_monotonic: 16
      n_nonmonotonic: 0
      beta: 5.0
      noise_std: 0.01
      noise_std_variable: true
      noise_std_scale: 5.0
      ar1_a: 0.8
      ar1_noise_std: 1.0
      zscore: true

  - name: "iter3_LMNM"
    labels: [filter-roll, linear, monotonic, non-monotonic]
    generator: "filter_roll_mts"
    base_params:
      n_linear: 12
      n_monotonic: 12
      n_nonmonotonic: 8
      beta: 5.0
      noise_std: 0.01
      noise_std_variable: true
      noise_std_scale: 5.0
      ar1_a: 0.8
      ar1_noise_std: 1.0
      zscore: true
