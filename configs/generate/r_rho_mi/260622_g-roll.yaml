# Functional-form case study (2026-06-22): filter-roll generator.
# Three iterations as classes, each a progressive filtration of channel filter families:
#   iter1_L     : all linear                       -> r, rho, MI all agree
#   iter2_LM    : half linear, half monotone(sig)  -> corr(r,rho) drops; corr(rho,MI) stays high
#   iter3_LMNM  : + small non-monotone minority     -> corr(.,MI) drops; corr(r,rho) recovers
# Shared AR(1) mother per MTS; per-channel SNR spread (noise_std_variable) populates the MPI.
# beta=3.142 (pi) LOCKED. corr(r,rho) falls monotonically with beta; beta=2pi breaks corr(r,rho)
#   deeper (iter2 ~0.69 vs ~0.78) BUT over-saturates M->sign(z) (M-M rho 0.94->0.88, M-NM MI 0.49->0.24)
#   -- a saturation/ties confound. pi keeps M cleanly monotone. See notebooks/presentation/r_rho_mi_figure_plan.md.
base_output_dir: data/r_rho_mi/260624_g-roll/
timestamp: false
pyspi_config: configs/pyspi-v2/cases/r_rho_mi.yaml
normalise: false
rng_seed: 260622
save_heatmap: true
threads: 1

defaults:
  M_values: [32]
  T_values: [2000]
  instances: 30

mts_classes:

  - name: "iter1_L"
    labels: [filter-roll, linear]
    generator: "filter_roll_mts"
    base_params:
      n_linear: 32
      n_monotonic: 0
      n_nonmonotonic: 0
      beta: 3.142
      noise_std: 0.1
      noise_std_variable: true
      noise_std_scale: 2.0
      ar1_a: 0.8
      ar1_noise_std: 1.0
      zscore: true

  - name: "iter2_LM"
    labels: [filter-roll, linear, monotonic]
    generator: "filter_roll_mts"
    base_params:
      n_linear: 16
      n_monotonic: 16
      n_nonmonotonic: 0
      beta: 3.142
      noise_std: 0.1
      noise_std_variable: true
      noise_std_scale: 2.0
      ar1_a: 0.8
      ar1_noise_std: 1.0
      zscore: true

  - name: "iter3_LMNM"
    labels: [filter-roll, linear, monotonic, non-monotonic]
    generator: "filter_roll_mts"
    base_params:
      n_linear: 12
      n_monotonic: 12
      n_nonmonotonic: 8
      beta: 3.142
      noise_std: 0.1
      noise_std_variable: true
      noise_std_scale: 2.0
      ar1_a: 0.8
      ar1_noise_std: 1.0
      zscore: true
