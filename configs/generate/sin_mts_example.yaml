base_output_dir: data/sin_mts_test/
pyspi_config: configs/pyspi/cases/r_rho_mi.yaml
pyspi_subset: default
normalise: false
rng_seed: 42
save_heatmap: false
threads: 4

defaults:
  M_values: [4, 8, 16, 32]
  T_values: [200, 400, 800, 1600]
  instances: [0, 1, 2, 3, 4, 5, 6, 7]

# sin_mts generator: two regime modes.
#
# regime='fixed': ordered assignment — first n_linear channels linear, next n_monotonic
#   monotonic, remaining non-monotonic. Defaults to M//3 each (3+3+3 for M=9).
#   Slug: M<M>_T<T>_I<I>_l-<l>_m-<m>_nm-<nm>  (always computable pre-generation)
#
# regime='random': each channel independently assigned a regime. Seeded from
#   (M, T, instance, mts_class) so the slug is reproducible without coupling to
#   the noise seed. Slug: M<M>_T<T>_I<I>_l-<l>_m-<m>_nm-<nm>
#
# Regime intervals for sin(t):
#   linear:        t in [-pi/16, pi/16]  -- approximately linear
#   monotonic:     t in [-pi/2,  pi/2]   -- strictly increasing
#   non-monotonic: t in [-pi,    pi]     -- full cycle
mts_classes:
  # - name: "SinMTS-Fixed"
  #   labels: ["sinusoidal", "fixed"]
  #   generator: "sin_mts"
  #   M_values: [9, 18, 36]  # make this an acceptable detail
  #   base_params:
  #     regime: "fixed"
  #     n_linear: 
  #     n_monotonic: 3
  #     noise_std: 0.05
  #     zscore: false

  - name: "SinMTS-Random"
    labels: ["sinusoidal", "random"]
    generator: "sin_mts"
    base_params:
      regime: "random"
      noise_std: 0.05
      zscore: false
