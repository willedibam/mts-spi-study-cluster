base_output_dir: data/test/
pyspi_config: configs/pyspi/test_config.yaml
pyspi_subset: default
normalise: false
rng_seed: 110305
save_heatmap: false
threads: 8

defaults:
  M_values: [4, 8]
  T_values: [400, 800]
  instances: [0, 1]

mts_classes:
  - name: "VAR(1)-Unidirectional"
    labels: ["linear", "gaussian", "var", "directed"]
    generator: "varma"
    include_base_variant: true
    base_params:
      phi: 0.6
      coupling: 0.2
      topology: "ring-unidirectional"
      ma_phi: 0.0
      ma_coupling: 0.0
      noise_std: 0.1
      transients: 100
      zscore: true
      target_rho: 0.99
    variants: 

  - name: "CauchyNoise"
    labels: ["noise", "cauchy", "heavy-tail"]
    generator: "cauchy_noise"
    base_params:
      zscore: false