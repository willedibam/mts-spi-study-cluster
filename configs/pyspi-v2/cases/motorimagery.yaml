# pyspi config for MotorImagery (M=64, T=3000).
# Based on eeml.yaml with targeted removals for M=64 scale (4032 directed pairs):
#   - Removed: distance SPIs (DTW, GromovWasserstain, CrossPairwiseDistance),
#     LinearModel variants, CausalEntropy, CrossmapEntropy, DirectedInfo,
#     StochasticInteraction, InterDependenceScore, kraskov TE auto-embed.
#   - Retained: full coherence/spectral family, MI+TLMI+TE with both gaussian
#     and kraskov estimators (feasible at T=3000 within 24h walltime),
#     PairwiseDistance (euclidean+cosine, trivially fast).

.statistics.basic:
  Covariance:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
    dependencies:
    configs:
      - estimator: EmpiricalCovariance
      - estimator: LedoitWolf
      - estimator: EmpiricalCovariance
        squared: True
      - estimator: LedoitWolf
        squared: True

  Precision:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
    dependencies:
    configs:
      - estimator: EmpiricalCovariance
      - estimator: LedoitWolf
      - estimator: EmpiricalCovariance
        squared: True

  SpearmanR:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
    dependencies:
    configs:
      - squared: True
      - squared: False

  CrossCorrelation:
    labels:
      - undirected
      - linear
      - signed/unsigned
      - bivariate
      - time-dependent
    dependencies:
    configs:
      - statistic: "max"
      - statistic: "mean"

.statistics.distance:
  PairwiseDistance:
    labels:
      - unsigned
      - unordered
      - nonlinear
      - undirected
    dependencies:
    configs:
      - metric: "euclidean"
      - metric: "cosine"

.statistics.causal:
  RegressionErrorCausalInference:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
    dependencies:
    configs:

  InformationGeometricConditionalIndependence:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
    dependencies:
    configs:

.statistics.infotheory:
  MutualInfo:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
    dependencies:
    configs:
      - estimator: gaussian

      - estimator: kraskov
        prop_k: 4

  TimeLaggedMutualInfo:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
    dependencies:
    configs:
      - estimator: gaussian

      - estimator: kraskov
        prop_k: 4

  TransferEntropy:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
    dependencies:
    configs:
      - estimator: kraskov
        prop_k: 4
        k_history: 1
        l_history: 1

      - estimator: gaussian
        auto_embed_method: MAX_CORR_AIS
        k_search_max: 10
        tau_search_max: 2

      - estimator: gaussian
        k_history: 1
        l_history: 1

      - estimator: symbolic
        k_history: 1
        l_history: 1

