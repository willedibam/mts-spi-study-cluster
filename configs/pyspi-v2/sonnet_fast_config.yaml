# Intersection of sonnet_config.yaml and blended_sonnet_config.yaml.
#
# Contains only entries from sonnet_config whose (class, config-kwargs) also
# appear in blended_sonnet_config. Intended for feature processing over a
# common SPI subset on data computed with blended_sonnet_config.
#
# Labels mirror blended_sonnet_config (canonical): sonnet_config has a few
# label typos/mismatches (e.g. Covariance mislabeled 'nonlinear'; wavelet
# PhaseSlopeIndex labeled 'directed' there but 'undirected' in blended, which
# is what the existing meta.json's directed flag reflects).
#
# Excluded entries (in sonnet_config but NOT in blended_sonnet_config):
#   - .statistics.distance.DynamicTimeWarping  {global_constraint: itakura}
#   - .statistics.distance.Barycenter          {mode: dtw, statistic: mean}
#   - .statistics.causal.AdditiveNoiseModel    (default)

.statistics.basic:
  Covariance:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
    dependencies:
    configs:
      - estimator: EmpiricalCovariance

.statistics.infotheory:
  DirectedInfo:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
    dependencies:
    configs:
      - estimator: gaussian

  TransferEntropy:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
    dependencies:
    configs:
      - estimator: kraskov
        prop_k: 4
        auto_embed_method: MAX_CORR_AIS
        k_search_max: 10
        tau_search_max: 4
        dyn_corr_excl: AUTO

  IntegratedInformation:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
    dependencies:
    configs:
      - phitype: "star"

.statistics.spectral:
  CoherenceMagnitude:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
    dependencies:
    configs:
      - fs: 1

  PhaseSlopeIndex:
    labels:
      - directed
      - linear/nonlinear
      - unsigned
      - bivariate
      - frequency-dependent
    dependencies:
    configs:
      - fmin: 0
        fmax: 0.5

  PhaseLagIndex:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
    dependencies:
    configs:
      - fs: 1
        statistic: max

  SpectralGrangerCausality:
    labels:
      - directed
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
    dependencies:
    configs:
      - method: nonparametric
        fmin: 0
        fmax: 0.5
        statistic: mean

.statistics.wavelet:
  PhaseSlopeIndex:
    labels:
      - undirected
      - unsigned
      - time/frequency dependent
      - bivariate
    dependencies:
    configs:
      - fs: 1

.statistics.misc:
  Cointegration:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - time-dependent
    dependencies:
    configs:
      - method: aeg
        statistic: tstat
        autolag: aic
        maxlag: 10
        trend: ct

  PowerEnvelopeCorrelation:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - time-dependent
    dependencies:
    configs:
      - orth: False
        log: False
        absolute: False
