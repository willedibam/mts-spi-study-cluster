# Chate et al. (2008), Eqs (1),(2); angular noise width = 2*pi*eta.
simulation:
  density: 2.0
  speed: 0.5
  burn: 1000
  samples: 2000
  stride: 1
  bin_width: 4.0
cases:
  - {L: 32, eta: 0.44, start: ordered, seed: 910201}
  - {L: 32, eta: 0.44, start: random, seed: 910201}
  - {L: 32, eta: 0.476, start: ordered, seed: 910201}
  - {L: 32, eta: 0.476, start: random, seed: 910201}
  - {L: 32, eta: 0.52, start: ordered, seed: 910201}
  - {L: 32, eta: 0.52, start: random, seed: 910201}
