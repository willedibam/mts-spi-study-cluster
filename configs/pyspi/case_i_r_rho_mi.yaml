.statistics.basic:
  # Covariance
  Covariance:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
    dependencies:
    configs:
      - estimator: EmpiricalCovariance
      - estimator: GraphicalLasso
      - estimator: GraphicalLassoCV
      - estimator: LedoitWolf
      - estimator: OAS
      - estimator: ShrunkCovariance
      - estimator: EmpiricalCovariance
        squared: True
      - estimator: GraphicalLasso
        squared: True
      - estimator: LedoitWolf
        squared: True
      - estimator: OAS
        squared: True
      - estimator: ShrunkCovariance
        squared: True

  # Precision
  Precision:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
    dependencies:
    configs:
      - estimator: EmpiricalCovariance
      - estimator: GraphicalLasso
      - estimator: LedoitWolf
      - estimator: OAS
      - estimator: ShrunkCovariance
      - estimator: EmpiricalCovariance
        squared: True
      - estimator: GraphicalLasso
        squared: True
      - estimator: LedoitWolf
        squared: True
      - estimator: OAS
        squared: True
      - estimator: ShrunkCovariance
        squared: True

  # Spearman's correlation coefficient
  SpearmanR:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
    dependencies:
    configs:
      - squared: True
      - squared: False

  # Kendall's rank correlation coefficient
  KendallTau:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
    dependencies:
    configs:
      - squared: True
      - squared: False

  # Lagged correlation coefficient
  LaggedCorrelation:
    labels:
      - undirected
      - linear
      - signed/unsigned
      - bivariate
      - time-dependent
    dependencies:
    configs:
      - estimator: pearson
        max_tau: 5
        squared: False
      - estimator: pearson
        tau: 10
        squared: False
      - estimator: pearson
        tau: 20
        squared: False
      - estimator: spearman
        max_tau: 5
        squared: False
      - estimator: spearman
        tau: 10
        squared: False
      - estimator: spearman
        tau: 20
        squared: False
      - estimator: kendall
        max_tau: 5
        squared: False
      - estimator: kendall
        tau: 10
        squared: False
      - estimator: kendall
        tau: 20
        squared: False

  # statistics based on cross-correlation (squared means we square the xcorr, not the output)
  CrossCorrelation:
    labels:
      - undirected
      - linear
      - signed/unsigned
      - bivariate
      - time-dependent
    dependencies:
    configs:
      - statistic: "max"

      - statistic: "max"
        squared: True

      - statistic: "mean"

      - statistic: "mean"
        squared: True

      - statistic: "mean"
        sigonly: False

      - statistic: "mean"
        squared: True
        sigonly: False

.statistics.distance:
  PairwiseDistance:
    labels:
      - unsigned
      - unordered
      - nonlinear
      - undirected
    dependencies:
    configs:
      - metric: "euclidean"
      - metric: "cityblock"
      - metric: "cosine"
      - metric: "chebyshev"
      - metric: "canberra"
      - metric: "braycurtis"

.statistics.causal:
  # Additive noise model
  AdditiveNoiseModel:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
    dependencies:
    configs:
    
.statistics.infotheory:
  TransferEntropy:
    # Kraskov estimator with fixed embedding of 1 for source/target and DCE
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
    dependencies: 
      - java
    configs:
      - estimator: kraskov
        prop_k: 4
        k_history: 1
        l_history: 1
        dyn_corr_excl: AUTO

      - estimator: gaussian
        k_history: 1
        l_history: 1

  DirectedInfo: # No theiler window yet
      labels:
        - directed
        - nonlinear
        - unsigned
        - bivariate
        - time-dependent
      dependencies: 
        - java
      configs:
        - estimator: gaussian
        - estimator: kozachenko
        - estimator: kernel

.statistics.spectral:
  CoherenceMagnitude:
      labels:
        - undirected
        - linear
        - unsigned
        - bivariate
        - frequency-dependent
      dependencies:
      configs:
        - fs: 1

        - fmin: 0
          fmax: 0.25

        - fmin: 0.25
          fmax: 0.5

        - fs: 1
          statistic: max

        - fmin: 0
          fmax: 0.25
          statistic: max

        - fmin: 0.25
          fmax: 0.5
          statistic: max

  SpectralGrangerCausality:
    # Non-parametric Granger causality (no VAR model)
    labels:
      - directed
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
    dependencies:
    configs:
      - method: nonparametric
        fmin: 0
        fmax: 0.5
        statistic: mean

      - method: nonparametric
        fmin: 0
        fmax: 0.25
        statistic: mean

      - method: nonparametric
        fmin: 0.25
        fmax: 0.5
        statistic: mean

      - method: nonparametric
        fmin: 0
        fmax: 0.5
        statistic: max

      - method: nonparametric
        fmin: 0
        fmax: 0.25
        statistic: max

      - method: nonparametric
        fmin: 0.25
        fmax: 0.5
        statistic: max

        # Parametric Granger causality (VAR model with inferred or predefined order)

        # AR order optimised by BIC
      - method: parametric
        fmin: 0
        fmax: 0.5
        statistic: mean

      - method: parametric
        fmin: 0
        fmax: 0.25
        statistic: mean

      - fmin: 0.25
        fmax: 0.5
        method: parametric
        statistic: mean

        # AR order 1
      - fs: 1
        order: 1
        method: parametric
        statistic: mean

      - fmin: 0
        fmax: 0.25
        order: 1
        method: parametric
        statistic: mean

      - fmin: 0.25
        fmax: 0.5
        order: 1
        method: parametric
        statistic: mean

        # AR order 20
      - fs: 1
        order: 20
        method: parametric
        statistic: mean

      - fmin: 0
        fmax: 0.25
        order: 20
        method: parametric
        statistic: mean

      - fmin: 0.25
        fmax: 0.5
        order: 20
        method: parametric
        statistic: mean

        # AR order optimised by BIC
      - fs: 1
        method: parametric
        statistic: max

      - fmin: 0
        fmax: 0.25
        method: parametric
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        method: parametric
        statistic: max

        # AR order 1
      - fs: 1
        order: 1
        method: parametric
        statistic: max

      - fmin: 0
        fmax: 0.25
        order: 1
        method: parametric
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        order: 1
        method: parametric
        statistic: max

        # AR order 20
      - fs: 1
        order: 20
        method: parametric
        statistic: max

      - fmin: 0
        fmax: 0.25
        order: 20
        method: parametric
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        order: 20
        method: parametric
        statistic: max

  PhaseLagIndex:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
    dependencies:
    configs:
      - fs: 1

      - fmin: 0
        fmax: 0.25

      - fmin: 0.25
        fmax: 0.5

      - fs: 1
        statistic: max

      - fmin: 0
        fmax: 0.25
        statistic: max

      - fmin: 0.25
        fmax: 0.5
        statistic: max

.statistics.misc:
  PowerEnvelopeCorrelation:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - time-dependent
    dependencies:
    configs:
      - orth: False
        log: False
        absolute: False

      - orth: True
        log: False
        absolute: False

      - orth: False
        log: True
        absolute: False

      - orth: True
        log: True
        absolute: False

      - orth: True
        log: False
        absolute: True

      - orth: True
        log: True
        absolute: True
