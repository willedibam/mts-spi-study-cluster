# Basic statistics
.statistics.basic:
  # Covariance
  Covariance:
    labels:
      - undirected
      - linear
      - signed
      - multivariate
      - contemporaneous
    dependencies:
    configs:
      - estimator: EmpiricalCovariance

  # Spearman's correlation coefficient
  SpearmanR:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
    dependencies:
    configs:
      - squared: False

  # Kendall's rank correlation coefficient
  KendallTau:
    labels:
      - undirected
      - nonlinear
      - signed
      - bivariate
      - contemporaneous
    dependencies:
    configs:
      - squared: True

  # Lagged correlation coefficient
  LaggedCorrelation:
    labels:
      - undirected
      - linear
      - signed/unsigned
      - bivariate
      - time-dependent
    dependencies:
    configs:
      - estimator: pearson
        max_tau: 5
        squared: False
      - estimator: spearman
        max_tau: 5
        squared: False

  # statistics based on cross-correlation (squared means we square the xcorr, not the output)
  CrossCorrelation:
    labels:
      - undirected
      - linear
      - signed/unsigned
      - bivariate
      - time-dependent
    dependencies:
    configs:
      - statistic: "max"

.statistics.distance:
  PairwiseDistance:
    labels:
      - unsigned
      - unordered
      - nonlinear
      - undirected
    dependencies:
    configs:
      - metric: "euclidean"
      - metric: "cosine"

  DynamicTimeWarping:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
    dependencies:
    configs:
      - global_constraint: null

  CrossPairwiseDistance:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
    dependencies:
    configs:
      - metric: "euclidean"
        tau: 1
        statistic: "min"
      - metric: "euclidean"
        tau: 1
        statistic: "mean"

# .statistics.causal: removed — pyEDM requires pkg_resources (unavailable in Python 3.12+)

# Information-theoretic statistics
.statistics.infotheory:
  JointEntropy: # No theiler window yet
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
    dependencies: 
      - java
    configs:
      - estimator: gaussian

  ConditionalEntropy: # No theiler window yet
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
    dependencies: 
      - java
    configs:
      - estimator: gaussian

  # Mutual information
  MutualInfo:
    labels:
      - undirected
      - nonlinear
      - unsigned
      - bivariate
      - contemporaneous
    dependencies: 
      - java
    configs:
      - estimator: gaussian

      - estimator: kraskov
        prop_k: 4

  # Mutual information
  TimeLaggedMutualInfo:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
    dependencies: 
      - java
    configs:
      - estimator: gaussian
    
      - estimator: kraskov
        prop_k: 4

  # Transfer entropy
  TransferEntropy:
    labels:
      - directed
      - nonlinear
      - unsigned
      - bivariate
      - time-dependent
    dependencies: 
      - java
    configs:
      # Kraskov estimator with fixed embedding of 1 for source/target and DCE
      - estimator: kraskov
        prop_k: 4
        k_history: 1
        l_history: 1

      # Currently the Kernel method has an overload issue with the AIS calculator..
      # Kernel estimator with auto-embedding on source/target and DCE
      # - estimator: kernel
      #   auto_embed_method: MAX_CORR_AIS
      #   k_search_max: 4
      #   kernel_width: 0.25

      - estimator: gaussian
        k_history: 1
        l_history: 1

# statistics that analyse in the frequency-domain (see Schoegl and Supp, 2006)
.statistics.spectral:
  PhaseSlopeIndex:
    labels:
      - directed
      - linear/nonlinear
      - unsigned
      - bivariate
      - frequency-dependent
    dependencies:
    configs:
      - fmin: 0
        fmax: 0.5

  PhaseLockingValue:
    labels:
      - undirected
      - linear
      - unsigned
      - bivariate
      - frequency-dependent
    dependencies:
    configs:
      - fs: 1

.statistics.wavelet:
  PhaseSlopeIndex:
    labels:
      - undirected
      - unsigned
      - time/frequency dependent
      - bivariate
    dependencies:
    configs:
      - fs: 1

.statistics.misc:
  LinearModel:
    labels:
      - directed
      - linear
      - unsigned
      - bivariate
      - contemporaneous
    dependencies:
    configs:
      - model: Ridge
      - model: Lasso
