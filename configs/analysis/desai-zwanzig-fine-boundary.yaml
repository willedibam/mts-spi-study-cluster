eligibility:
  require_clean_homogeneous_provenance: true
  require_frozen_schema_and_spi_order: true
  maximum_selected_feature_missingness_per_row: 0.05
  target_blind_row_exclusion: true
  maximum_excluded_fraction: 0.02
  minimum_retained_confirmation_instances_per_control_arm: 3
