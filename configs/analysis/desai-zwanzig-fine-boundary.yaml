evaluation:
  primary_claim: held_out_macroscopic_order_coordinate_tracking_and_boundary_localization
  primary_metric: absolute_spearman_q_vs_future_mean_abs_M1
  supplementary_metrics:
    - control_mean_spearman
    - within_control_spearman
    - normalized_maximum_adjacent_change
    - steepest_interval_and_distance_to_reference_boundary
    - finite_N32_transfer_sensitivity
    - supervised_isotonic_readout_mae
    - control_only_isotonic_readout_mae
    - paired_sharpness_difference_ci95
  sharpness_bonus_is_evaluative_not_part_of_q_construction: true
  not_claimed:
    - exact_thermodynamic_critical_point_from_finite_N_data
    - q_equals_Q_without_monotone_calibration
    - realization_level_recovery_without_within_control_evidence
