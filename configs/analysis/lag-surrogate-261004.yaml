status: prospective_before_p90_outcomes
purpose: Test temporal organization after exact matching of covariance and circular cross-spectrum; full p90 means remain a required competitor
M: 16
T: 1000
classes: [alternating-lag, shared-phase]
model: Eight independent Gaussian channel pairs; driver permutation swaps adjacent blocks of five observations, giving lags +5/-5. Pair loadings are a permutation of eight equally spaced values .35 to .85. Randomize channel labels. Center and standardize each channel before paired Fourier phase rotation.
meaning: Nonstationary temporal organization of Gaussian dependence, not nonlinear or causal dynamics. Individual channels before empirical normalization are Gaussian iid in both generating ensembles. Shared phase preserves every realized circular auto/cross-covariance, but not the realized amplitude histogram or edge-trimmed correlations.
