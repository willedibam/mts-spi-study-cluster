  controls: Signed/absolute covariance summaries, standardized z, validity-only, independently edge-shuffled z, zero-coupling paired records, channel third/fourth moments
  inference: Paired block bootstrap5000; intervals condition on training and design
  display: Fixed training-fit PCA2 and UMAP30/min_dist.1/seed261003, all validation points; no seed or class selection
