# Pearson, Spearman and ordinary KSG MI only (no temporal-exclusion variant): the 2026-10-24 strength-spread sweep.
.statistics.basic:
  Covariance:
    labels:
    - undirected
    - linear
    - signed
    - multivariate
    - contemporaneous
    dependencies: null
    configs:
    - estimator: EmpiricalCovariance
  SpearmanR:
    labels:
    - undirected
    - nonlinear
    - signed
    - bivariate
    - contemporaneous
    dependencies: null
    configs:
    - squared: false
.statistics.infotheory:
  MutualInfo:
    labels:
    - undirected
    - nonlinear
    - unsigned
    - bivariate
    - contemporaneous
    dependencies: null
    configs:
    - estimator: kraskov
      prop_k: 4

