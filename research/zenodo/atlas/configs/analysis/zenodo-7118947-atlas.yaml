feature_artifact: data/zenodo_7118947/features/pearson-unified-v3-seed1729.npz
output_dir: results/zenodo_7118947/atlas-seed1729
random_state: 1729
threads: 12

# NaNs are preserved in the canonical feature artifact. The primary analysis
# retains features defined for >=95% of datasets, then median-imputes remaining
# values. Alternatives quantify sensitivity rather than being selected by eye.
validity_thresholds: [0.90, 0.95, 1.00]
primary_validity_threshold: 0.95
variance_threshold: 1.0e-8

pca:
  max_components: 100

clustering:
  pca_dimensions: [10, 20, 40, 80]
  minimum_clusters: 1
  maximum_clusters: 15
  gmm_covariance_types: [diag, tied, full]
  hdbscan_min_cluster_size: [15, 25, 40, 60, 100]
  hdbscan_min_samples: [5, 10, 20]
  stability_seeds: [11, 23, 47, 71, 101, 137, 173, 211]
  subsample_fraction: 0.80
  minimum_subsample_stability: 0.70

embeddings:
  input_pca_dimensions: 50
  seeds: [1729, 2718, 3141]
  umap:
    n_neighbors: [15, 30, 60, 120]
    min_dist: [0.05, 0.20, 0.50]
    metric: [euclidean, cosine]
  tsne:
    perplexity: [15, 30, 50, 100]
    max_iter: 1500
