.statistics.basic:
  Covariance:
    labels:
    - undirected
    - linear
    - signed
    - multivariate
    - contemporaneous
    - M14
    dependencies: null
    configs:
    - estimator: EmpiricalCovariance
  Precision:
    labels:
    - undirected
    - linear
    - signed
    - multivariate
    - contemporaneous
    - M14
    dependencies: null
    configs:
    - estimator: GraphicalLassoCV
      squared: true
    - estimator: LedoitWolf
      squared: true
    - estimator: OAS
      squared: true
    - estimator: ShrunkCovariance
      squared: true
.statistics.distance:
  PairwiseDistance:
