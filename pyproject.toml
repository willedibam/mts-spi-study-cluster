[project]
name = "mts-spi-study-cluster"
version = "0.1.0"
description = "PBS-ready driver for multivariate time-series SPI studies"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6.0",
    # pyspi: install from local fork (editable): uv pip install -e ../pyspi-fork
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "umap-learn>=0.5.5",
    "tqdm>=4.66",
    "psutil>=5.9",
    "pyarrow>=15.0",
    # "JPype1>=1.5",  # no longer needed — JIDT eliminated in pyspi-v2
    "pyclustering>=0.10.1",
    "xarray",
    "dtaidistance==2.3.13",
    "dtw-python",
    "fastdtw",
    "infomeasure>=0.6.0",
    "torch>=2.10.0",
    "torch-geometric>=2.7.0",
]

[project.optional-dependencies]
real = ["sktime>=0.30.0", "aeon", "yfinance"]
dtw = ["dtw-python", "fastdtw", "dtaidistance"]
graph = ["torch>=2.0", "torch-geometric>=2.5"]

[project.scripts]
run-experiment = "src.run_experiments:main"
process-features = "src.process_features:main"
feature-selection = "src.feature_selection:main"
run-dtw-ed = "src.run_dtw_ed:main"
find-distributions = "src.find_non_overlapping_distributions:main"
graph-pipeline = "src.graph_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
