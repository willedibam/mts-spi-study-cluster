[project]
name = "mtsspi"
version = "0.1.0"
description = "PBS-ready driver for multivariate time-series SPI studies"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6.0",
    # pyspi itself is NOT listed here; it ships as a sister repo at ../pyspi-fork
    # and MUST be installed editable after creating the venv:
    #   uv pip install -e ../pyspi-fork
    # The old `setuptools<80` cap existed because pyEDM/LoadData.py imported
    # pkg_resources, which setuptools 80 removed from the default install.
    # pyspi 3.0 requires pyEDM>=2.5, which dropped that import, so the cap is
    # gone. setuptools stays listed only because Python 3.12 venvs no longer
    # bundle it (PEP 632).
    "setuptools>=68",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.8",
    # The sibling checkout, editable: see [tool.uv.sources].
    "pyspi",
    "umap-learn>=0.5.5",
    "tqdm>=4.66",
    "psutil>=5.9",
    "pyarrow>=15.0",
    # JPype1 is not needed: pyspi 3.0 has no Java/JIDT dependency at all.
    "pyclustering>=0.10.1",
    "xarray",
    "dtaidistance==2.3.13",
    "dtw-python",
    "fastdtw",
    "torch>=2.1.0",
    "torch-geometric>=2.5.0",
    "plotly>=6.7.0",
    "nbformat>=5.10.4",
    "opentsne>=1.0.4",
]

[project.optional-dependencies]
# aeon/sktime/yfinance are safe to install alongside pyspi.
# The old warning here said mne must be held below 1.0 because
# pyspi/statistics/wavelet.py used the `mne.connectivity` module removed in
# mne 1.0. That is obsolete and now actively harmful: pyspi 3.0 imports
# `mne_connectivity` and *requires* mne>=1.6 and mne-connectivity>=0.5.
# Do not downgrade mne before submitting PBS jobs.
# aeon (UEA loaders, MiniRocket) caps numpy below what pyspi 3.0 needs, so it
# cannot be locked with the rest: install it in a separate environment.
real = ["yfinance"]
prep = ["mne>=1.6.0", "moabb>=1.0.0"]
atlas = ["pycatch22>=0.5.0"]
interactive = ["anywidget>=0.9", "ipywidgets>=8.1"]

[project.scripts]
run-corpus = "mtsspi.run_corpus:main"
process-features = "mtsspi.process_features:main"
corpus-geometry = "research.zenodo.atlas.run_corpus_geometry:main"

# The library is src/mtsspi; scripts/ holds command-line entry points; research/
# holds each study's own code, configs and notebooks.
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["mtsspi*", "scripts*", "research*"]


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
pyspi = { path = "../pyspi-fork", editable = true }

# Installed by `uv sync` unless --no-dev: tests and notebook execution.
[dependency-groups]
dev = ["pytest", "ipykernel", "nbclient", "nbconvert"]

# Tests import the checkout they sit in, not another checkout's editable install.
[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "research"]
# Study tests live in research/<stream>/<study>/tests/ and may share basenames.
addopts = "--import-mode=importlib"
